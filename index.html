<title>Central de Comissões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    color-scheme: dark;
    --bg: #0a0c10;
    --surface: #12151c;
    --surface-2: #191d26;
    --surface-3: #21262f;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --ink: #f2f3f5;
    --ink-soft: rgba(242,243,245,0.64);
    --ink-faint: rgba(242,243,245,0.38);
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-soft: rgba(57,135,229,0.14);
    --seg-1: #3987e5;
    --seg-2: #d95926;
    --seg-3: #199e70;
    --seg-4: #c98500;
    --good: #0ca30c;
    --good-soft: rgba(29,192,60,0.14);
    --warn: #fab219;
    --warn-soft: rgba(250,178,25,0.14);
    --crit: #e0524f;
    --crit-soft: rgba(224,82,79,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 40px rgba(0,0,0,0.45);
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(57,135,229,0.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--accent-soft); }
  .mono{ font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a{ color: inherit; }
  button{ font: inherit; }
  input, select, textarea{ font: inherit; color: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .eyebrow{
    display: flex; align-items: center; gap: 0.5rem;
    font-family: "JetBrains Mono", monospace; font-size: 0.68rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .dot{ width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--good); flex: none; box-shadow: 0 0 0 3px var(--good-soft); }

  /* ---------- SHELL ---------- */
  .shell{ max-width: 78rem; margin: 0 auto; padding: 1.6rem clamp(1rem, 3vw, 2.2rem) 4rem; }
  .topbar{
    display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem;
    flex-wrap: wrap; margin-bottom: 1.4rem;
  }
  .topbar h1{ font-size: clamp(1.5rem, 1.6vw + 1rem, 1.9rem); font-weight: 800; margin: 0.3rem 0 0.35rem; letter-spacing: -0.01em; }
  .topbar .meta{ font-size: 0.82rem; color: var(--ink-soft); }
  .topbar .meta b{ color: var(--ink); font-weight: 600; }
  .top-actions{ display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .btn{
    display: inline-flex; align-items: center; gap: 0.5rem;
    border: 1px solid var(--line-strong); background: var(--surface-2);
    color: var(--ink); border-radius: 0.55rem; padding: 0.62rem 1rem;
    font-weight: 700; font-size: 0.82rem; cursor: pointer;
    transition: border-color .15s, background-color .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:hover{ border-color: var(--accent); }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{ background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:hover{ color: var(--ink); background: var(--surface-2); }
  .btn-danger{ color: var(--crit); }
  .btn svg{ width: 1rem; height: 1rem; flex: none; }
  .btn:disabled{ opacity: 0.5; cursor: not-allowed; }

  .banner{
    display: flex; align-items: center; gap: 0.6rem;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 0.6rem; padding: 0.7rem 1rem; font-size: 0.82rem; color: var(--ink-soft);
    margin-bottom: 1.2rem;
  }
  .banner.warn{ border-color: rgba(250,178,25,0.35); color: #f4c766; }
  .banner button{ margin-left: auto; }

  /* ---------- KPIs ---------- */
  .kpis{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr));
    gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: 0.75rem; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .kpi{ background: var(--surface); padding: 1.1rem 1.3rem; }
  .kpi .l{ font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-faint); font-family: "JetBrains Mono", monospace; }
  .kpi .n{ font-size: clamp(1.4rem, 1.4vw + 0.9rem, 1.7rem); font-weight: 800; margin-top: 0.4rem; letter-spacing: -0.01em; }
  .kpi .d{ font-size: 0.76rem; margin-top: 0.4rem; display: flex; align-items: center; gap: 0.3rem; }
  .kpi .d.up{ color: var(--good); }
  .kpi .d.down{ color: var(--crit); }
  .kpi .d.flat{ color: var(--ink-faint); }
  .kpi .bar{ margin-top: 0.6rem; height: 0.3rem; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .kpi .bar > span{ display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  /* ---------- CARD / SECTION ---------- */
  .card{
    background: var(--surface); border: 1px solid var(--line); border-radius: 0.85rem;
    box-shadow: var(--shadow); margin-top: 1.2rem; overflow: hidden;
  }
  .card-head{ padding: 1.2rem 1.3rem 0.2rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .card-head h2{ font-size: 1.05rem; font-weight: 800; margin: 0; }
  .card-head .sub{ font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.2rem; }
  .legend{ display: flex; gap: 0.4rem; flex-wrap: wrap; font-size: 0.76rem; color: var(--ink-soft); }
  .legend-item{
    display: inline-flex; align-items: center; gap: 0.35rem;
    background: none; border: 1px solid transparent; border-radius: 999px;
    padding: 0.28rem 0.6rem 0.28rem 0.5rem; cursor: pointer; color: var(--ink-soft);
    font: inherit; transition: opacity .15s, border-color .15s, background-color .15s;
  }
  .legend-item:hover{ background: var(--surface-2); border-color: var(--line); }
  .legend-item.active{ background: var(--surface-2); border-color: var(--line-strong); color: var(--ink); font-weight: 700; }
  .legend-item.dim{ opacity: 0.4; }
  .legend-item i{ width: 0.55rem; height: 0.55rem; border-radius: 2px; display: inline-block; flex: none; }

  /* ---------- FLOW CHART ---------- */
  .flow-wrap{ padding: 0.6rem 0.6rem 1.2rem; }
  .flow-svg{ width: 100%; height: auto; display: block; }
  .flow-path{ transition: opacity .15s; cursor: pointer; }
  .flow-node{ transition: opacity .15s; cursor: pointer; }
  .flow-dim{ opacity: 0.12 !important; }
  .flow-label{ font-family: "JetBrains Mono", monospace; font-size: 10.5px; fill: var(--ink-soft); }
  .flow-label-strong{ font-family: "Manrope", sans-serif; font-size: 12px; font-weight: 700; fill: var(--ink); }
  .flow-hint{ font-size: 0.74rem; color: var(--ink-faint); padding: 0 1.3rem 1rem; margin-top: -0.4rem; }
  .flow-empty{ padding: 2.6rem 1.5rem; text-align: center; color: var(--ink-soft); font-size: 0.86rem; line-height: 1.6; }

  /* ---------- TWO COL LAYOUT ---------- */
  .grid-2{ display: grid; grid-template-columns: 2fr 1fr; gap: 1.2rem; align-items: start; }
  @media (max-width: 58rem){ .grid-2{ grid-template-columns: 1fr; } }

  /* ---------- TABLE ---------- */
  .toolbar{ display: flex; gap: 0.6rem; padding: 0 1.3rem 1rem; flex-wrap: wrap; align-items: center; }
  .toolbar .search{
    display: flex; align-items: center; gap: 0.5rem; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.5rem 0.8rem; flex: 1 1 12rem; max-width: 18rem;
  }
  .toolbar .search svg{ width: 0.95rem; height: 0.95rem; color: var(--ink-faint); flex: none; }
  .toolbar .search input{ border: none; background: none; outline: none; width: 100%; font-size: 0.85rem; }
  .toolbar select{
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: 0.5rem; padding: 0.5rem 0.7rem; font-size: 0.8rem;
  }
  .table-wrap{ overflow-x: auto; }
  table{ width: 100%; border-collapse: collapse; font-size: 0.84rem; min-width: 44rem; }
  thead th{
    text-align: left; padding: 0.6rem 1rem; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-faint); border-bottom: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace; white-space: nowrap;
  }
  tbody td{ padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr{ cursor: pointer; transition: background-color .1s; }
  tbody tr:hover{ background: var(--surface-2); }
  tbody tr:last-child td{ border-bottom: none; }
  .cliente-cell b{ display: block; font-weight: 700; }
  .cliente-cell span{ display: block; font-size: 0.74rem; color: var(--ink-faint); margin-top: 0.1rem; }
  .badge{
    display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.6rem;
    border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap;
  }
  .badge.good{ background: var(--good-soft); color: var(--good); }
  .badge.accent{ background: var(--accent-soft); color: #7db2ee; }
  .badge.critical{ background: var(--crit-soft); color: var(--crit); }
  .badge.muted{ background: var(--surface-3); color: var(--ink-faint); }
  .segdot{ width: 0.5rem; height: 0.5rem; border-radius: 2px; display: inline-block; margin-right: 0.4rem; flex:none; }
  .paper-btn{
    display: inline-flex; align-items: center; justify-content: center;
    width: 2rem; height: 2rem; border-radius: 0.45rem; color: var(--ink-faint);
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .paper-btn svg{ width: 1rem; height: 1rem; }
  .paper-btn.has-file{ color: var(--accent); border-color: rgba(57,135,229,0.35); background: var(--accent-soft); cursor: pointer; transition: transform .1s, filter .15s; }
  .paper-btn.has-file:hover{ filter: brightness(1.15); }
  .paper-btn.has-file:active{ transform: translateY(1px); }
  .anexo-status{ display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; padding: 0.55rem 0.7rem; border-radius: 0.5rem; background: var(--surface-2); border: 1px solid var(--line); font-size: 0.8rem; }
  .anexo-status.ok{ color: var(--good); border-color: rgba(29,192,60,0.3); }
  .anexo-status.muted{ color: var(--ink-faint); }
  .anexo-status svg{ width: 0.95rem; height: 0.95rem; flex: none; }
  .anexo-status button{ margin-left: auto; background: none; border: none; color: var(--ink-soft); font-size: 0.74rem; cursor: pointer; text-decoration: underline; }
  .anexo-status button:hover{ color: var(--crit); }
  .empty-row td{ padding: 2.5rem 1rem; text-align: center; color: var(--ink-soft); }
  .row-money{ font-family: "JetBrains Mono", monospace; }
  .row-money.pos{ color: var(--good); }
  .row-money.pending{ color: var(--warn); }

  /* ---------- ALERTS ---------- */
  .alerts{ padding: 0.4rem 1.3rem 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .alert{
    display: flex; gap: 0.7rem; padding: 0.7rem 0.8rem; border-radius: 0.55rem;
    background: var(--surface-2); border: 1px solid var(--line); font-size: 0.82rem;
  }
  .alert .ic{
    width: 1.6rem; height: 1.6rem; border-radius: 50%; flex: none; display: flex; align-items: center;
    justify-content: center; font-size: 0.85rem;
  }
  .alert.critical .ic{ background: var(--crit-soft); color: var(--crit); }
  .alert.warn .ic{ background: var(--warn-soft); color: var(--warn); }
  .alert.good .ic{ background: var(--good-soft); color: var(--good); }
  .alert .tt{ font-weight: 700; }
  .alert .ds{ color: var(--ink-soft); font-size: 0.78rem; margin-top: 0.1rem; }
  .alert-empty{ padding: 1.4rem; text-align: center; color: var(--ink-faint); font-size: 0.82rem; }

  /* ---------- EMPTY STATE ---------- */
  .empty-state{ text-align: center; padding: 3.4rem 1.5rem; }
  .empty-state h3{ font-size: 1.2rem; margin: 0 0 0.5rem; }
  .empty-state p{ color: var(--ink-soft); font-size: 0.86rem; max-width: 28rem; margin: 0 auto 1.2rem; }
  .empty-state .row{ display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }

  /* ---------- DRAWER ---------- */
  .overlay{
    position: fixed; inset: 0; background: rgba(4,5,7,0.6);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40;
  }
  .overlay.open{ opacity: 1; pointer-events: auto; }
  .drawer{
    position: fixed; top: 0; right: 0; height: 100%; width: min(28rem, 100vw);
    background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: var(--shadow); z-index: 41;
    transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open{ transform: translateX(0); }
  .drawer-head{ display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--line); }
  .drawer-head h2{ font-size: 1.05rem; margin: 0; font-weight: 800; }
  .drawer-close{ width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .drawer-body{ padding: 1.2rem 1.3rem; overflow-y: auto; flex: 1 1 auto; }
  .drawer-foot{ padding: 1.1rem 1.3rem; border-top: 1px solid var(--line); display: flex; gap: 0.7rem; }
  .drawer-foot .btn{ flex: 1; justify-content: center; }

  .field-row{ display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 0.9rem; }
  .field-row.single{ grid-template-columns: 1fr; }
  .field label{ font-size: 0.76rem; font-weight: 700; display: block; margin-bottom: 0.35rem; color: var(--ink-soft); }
  .field input, .field select, .field textarea{
    width: 100%; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink);
    border-radius: 0.5rem; padding: 0.55rem 0.7rem; font-size: 0.85rem;
  }
  .field textarea{ min-height: 4rem; resize: vertical; }
  .msg{ font-size: 0.8rem; padding: 0.6rem 0.8rem; border-radius: 0.45rem; margin-top: 0.4rem; }
  .msg.err{ background: var(--crit-soft); color: var(--crit); }
  .msg.ok{ background: var(--good-soft); color: var(--good); }

  .detail-kv{ display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.2rem; }
  .detail-kv .k{ font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); }
  .detail-kv .v{ font-weight: 700; margin-top: 0.15rem; }
  .repasse-list{ display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.6rem; }
  .repasse-item{ display: flex; justify-content: space-between; align-items: center; padding: 0.55rem 0.7rem; background: var(--surface-2); border-radius: 0.45rem; font-size: 0.82rem; border: 1px solid var(--line); }
  .divider{ height: 1px; background: var(--line); margin: 1.2rem 0; }

  /* ---------- TABS ---------- */
  .tabs{ display: flex; gap: 0.4rem; margin: 0 0 1.2rem; border-bottom: 1px solid var(--line); }
  .tab-btn{
    background: none; border: none; color: var(--ink-soft); font: inherit; font-weight: 700;
    font-size: 0.85rem; padding: 0.7rem 0.2rem; margin-right: 1.2rem; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s;
  }
  .tab-btn:hover{ color: var(--ink); }
  .tab-btn.active{ color: var(--ink); border-color: var(--accent); }

  /* ---------- CALCULATOR ---------- */
  .calc-grid{ display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.4rem; padding: 0.4rem 1.3rem 1.4rem; align-items: start; }
  @media (max-width: 58rem){ .calc-grid{ grid-template-columns: 1fr; } }
  .calc-form .field-row{ margin-bottom: 0.8rem; }
  .calc-hint{ font-size: 0.72rem; color: var(--ink-faint); margin-top: 0.3rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .calc-hint button{ background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 0.72rem; padding: 0; }
  .calc-results{ display: flex; flex-direction: column; gap: 1rem; }
  .calc-result-card{ border: 1px solid var(--line); border-radius: 0.7rem; overflow: hidden; background: var(--surface-2); }
  .calc-result-card.buyer{ border-color: rgba(57,135,229,0.3); }
  .calc-result-card.seller{ border-color: rgba(29,192,60,0.3); }
  .crc-head{ padding: 0.7rem 1rem; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .calc-result-card.seller .crc-head{ background: var(--good-soft); color: var(--good); }
  .calc-result-card.buyer .crc-head{ background: var(--accent-soft); color: var(--accent); }
  .crc-line{ display: flex; justify-content: space-between; padding: 0.5rem 1rem; font-size: 0.84rem; color: var(--ink-soft); border-top: 1px solid var(--line); }
  .crc-line span:last-child{ font-family: "JetBrains Mono", monospace; }
  .crc-total{ display: flex; justify-content: space-between; padding: 0.8rem 1rem; font-weight: 800; font-size: 1rem; border-top: 1px solid var(--line-strong); background: var(--surface); }
  .crc-total span:last-child{ font-family: "JetBrains Mono", monospace; }
  .calc-note{ font-size: 0.76rem; color: var(--ink-faint); margin-top: 0.2rem; line-height: 1.5; }
  .calc-copy-row{ display: flex; align-items: center; gap: 0.7rem; margin-top: 0.2rem; }
  .calc-copy-msg{ font-size: 0.78rem; color: var(--good); }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; animation: none !important; } }
</style>

<div class="shell" id="app"></div>

<script id="app-script">
(function(){
  "use strict";

  var SEGMENTOS = [
    { id: "imovel",   label: "Imóveis",        cssvar: "--seg-1" },
    { id: "veiculo",  label: "Veículos",       cssvar: "--seg-2" },
    { id: "servicos", label: "Serviços",       cssvar: "--seg-3" },
    { id: "pesados",  label: "Pesados / Motos", cssvar: "--seg-4" }
  ];
  var SEG_BY_ID = {}; SEGMENTOS.forEach(function(s){ SEG_BY_ID[s.id] = s; });

  var STATUS = {
    ativo:       { label: "Ativo",        tone: "good" },
    contemplado: { label: "Contemplado",  tone: "accent" },
    atrasado:    { label: "Atrasado",     tone: "critical" },
    cancelado:   { label: "Cancelado",    tone: "muted" }
  };

  var uidVal = null, dbc = null, perfilRef = null;
  var contratos = [];
  var perfil = { metaMensal: 6000 };
  var mode = "loading";
  var viewerName = "";
  var search = "";
  var statusFilter = "todos";
  var repasseFilter = "todos";
  var dataDe = "";
  var dataAte = "";
  var pendingAnexo = null;
  var anexoRemoved = false;
  var uploadingAnexo = false;
  var flowSelected = null;
  var activeTab = "painel";
  var calcInputs = {
    cliente: "", segmento: "imovel", contemplada: "nao",
    valorCredito: 0, parcelasTotal: 0, parcelasPagas: 0, valorParcela: 0,
    valorJaPago: 0, saldoDevedor: 0,
    agioPercent: 0, taxaTransferencia: 0, taxaPagaPor: "comprador"
  };
  var openDrawerName = null; // 'nova' | 'detalhe' | 'importar'
  var selectedId = null;
  var editingDetail = false;
  var loadingSample = false;
  var formMsg = "";
  var importParsed = null;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function fmtBRL(n){
    n = Number(n) || 0;
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  }
  function fmtDate(iso){
    if(!iso) return "—";
    try{ return new Date(iso + "T00:00:00").toLocaleDateString("pt-BR"); }catch(e){ return iso; }
  }
  function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function genId(){ return "c_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ---------- anexo (contract/carta attachment) ----------
  function paperIconSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>';
  }
  function anexoCell(c){
    if(c.anexoId){
      return '<a class="paper-btn has-file" data-action="open-anexo" href="/_blob/'+esc(c.anexoId)+'" target="_blank" rel="noopener" title="Abrir '+esc(c.anexoNome||"anexo")+'">'+paperIconSvg()+'</a>';
    }
    return '<span class="paper-btn" title="Nenhum anexo">'+paperIconSvg()+'</span>';
  }
  function guessAnexoType(name, blobType){
    if(blobType) return blobType;
    var ext = (name||"").split(".").pop().toLowerCase();
    return { pdf:"application/pdf", png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", webp:"image/webp" }[ext] || "";
  }
  function anexoField(current){
    var show = anexoRemoved ? null : (pendingAnexo || current);
    var status;
    if(uploadingAnexo){
      status = '<div class="anexo-status">Enviando arquivo…</div>';

    } else {

      '<input type="file" id="anexo-file" accept=".pdf,.png,.jpg,.jpeg,.webp">' + status + '</div></div>';

  async function handleAnexoUpload(file){
    uploadingAnexo = true; render();
    var assetsCap = null;
    try{ assetsCap = window.claude ? await window.claude.use("assets") : null; }catch(e){}
    if(!assetsCap){ uploadingAnexo = false; alert("Anexos indisponíveis nesta visualização."); render(); return; }
    try{
      var type = guessAnexoType(file.name, file.type);
      var res = await assetsCap.upload(file, type ? { type: type } : undefined);
      pendingAnexo = { id: res.id, nome: file.name, contentType: res.contentType };
      anexoRemoved = false;
    }catch(e){
      alert("Não foi possível anexar o arquivo: " + (e && e.message ? e.message : "tente novamente."));
    }

  function sumRepasses(c, statusWanted, monthFilter){
    return (c.repasses || []).filter(function(r){
      if(statusWanted && r.status !== statusWanted) return false;
      if(monthFilter && monthKey(r.data) !== monthFilter) return false;
      return true;
    }).reduce(function(s,r){ return s + (Number(r.valor)||0); }, 0);
  }

  function sampleContratos(){
    var today = new Date();
    var firstNames = ["Marcos","Fernanda","Ricardo","Juliana","Eduardo","Patrícia","Diego","Camila","Bruno","Larissa","Rafael","Vanessa","Thiago","Aline","Gustavo","Mariana","Felipe","Priscila","Rodrigo","Simone","André","Bianca","Caio","Débora","Elaine","Fábio","Gabriela","Henrique","Isabela","João Pedro"];
    var lastNames = ["Andrade","Lopes Cardoso","Nogueira","Prado Martins","Salles Barbosa","Gomes Ribeiro","Fernandes Costa","Rezende Alves","Cesar Teixeira","Moura Pinto","Augusto Lima","Cristina Souza","Henrique Rocha","Beatriz Fonseca","Vitória Castro","Nascimento","Farias","Almeida Vieira","Cristina Batista","Carvalho Reis"];
    var statusCycle = ["ativo","ativo","ativo","ativo","ativo","contemplado","contemplado","contemplado","ativo","atrasado","atrasado","cancelado","ativo","contemplado","ativo"];
    var segConfig = {
      imovel:   { credMin:150000, credMax:450000, comMin:5,  comMax:7,   parcMin:180, parcMax:220 },
      veiculo:  { credMin:40000,  credMax:120000, comMin:4,  comMax:6,   parcMin:60,  parcMax:84  },
      servicos: { credMin:15000,  credMax:60000,  comMin:6,  comMax:9,   parcMin:36,  parcMax:60  },
      pesados:  { credMin:120000, credMax:280000, comMin:5,  comMax:6.5, parcMin:72,  parcMax:100 }
    };
    var out = [];
    var nameIdx = 0;
    SEGMENTOS.forEach(function(seg){
      var cfg = segConfig[seg.id];
      for(var i=0;i<25;i++){
        var fn = firstNames[nameIdx % firstNames.length];
        var ln = lastNames[(nameIdx*7) % lastNames.length];
        nameIdx++;
        var status = statusCycle[i % statusCycle.length];
        var daysAgo = 20 + Math.floor(Math.random()*520);
        var dv = new Date(today); dv.setDate(dv.getDate()-daysAgo);
        var dataVenda = dv.toISOString().slice(0,10);
        var valorCredito = Math.round((cfg.credMin + Math.random()*(cfg.credMax-cfg.credMin))/1000)*1000;
        var comissaoPercentual = Math.round((cfg.comMin + Math.random()*(cfg.comMax-cfg.comMin))*10)/10;
        var parcelasTotal = Math.round(cfg.parcMin + Math.random()*(cfg.parcMax-cfg.parcMin));
        var comissaoTotal = Math.round(valorCredito * comissaoPercentual/100);
        var comissaoParcela = Math.max(1, Math.round(comissaoTotal/parcelasTotal));
        var monthsSince = Math.max(0, Math.floor(daysAgo/30));
        var parcelasPagas = status === "cancelado" ? Math.min(monthsSince, Math.floor(parcelasTotal*0.2)+1) : Math.min(monthsSince, parcelasTotal);
        var repasses = [];
        var repMonths = status === "cancelado" ? Math.min(parcelasPagas,3) : Math.min(parcelasPagas,6);
        for(var m=repMonths;m>=1;m--){
          var rd = new Date(today); rd.setMonth(rd.getMonth()-m);
          repasses.push({ data: rd.toISOString().slice(0,10), valor: comissaoParcela, status: "recebido" });
        }
        if((status === "ativo" || status === "contemplado") && parcelasPagas < parcelasTotal){
          var nd = new Date(today); nd.setDate(nd.getDate() + 5 + Math.floor(Math.random()*20));
          repasses.push({ data: nd.toISOString().slice(0,10), valor: comissaoParcela, status: "previsto" });
        }
        out.push({
          id: genId(),
          cliente: fn + " " + ln,
          telefone: "(11) 9" + (1000+Math.floor(Math.random()*8999)) + "-" + (1000+Math.floor(Math.random()*8999)),
          numeroCarta: String(100 + out.length),
          grupo: String(700 + Math.floor(Math.random()*600)),
          cota: String(10 + Math.floor(Math.random()*290)),
          segmento: seg.id,
          valorCredito: valorCredito,
          dataVenda: dataVenda,
          status: status,
          comissaoPercentual: comissaoPercentual,
          comissaoTotal: comissaoTotal,
          parcelasPagas: parcelasPagas,
          parcelasTotal: parcelasTotal,
          observacoes: status === "atrasado" ? "Parcela em atraso — necessário contato." : (status === "cancelado" ? "Desistência do cliente." : ""),
          repasses: repasses
        });
      }
    });
    return out;
  }

  async function init(){
    var user = null, db = null;
    try{ user = window.claude ? await window.claude.use("user") : null; }catch(e){}
    try{ db = window.claude ? await window.claude.use("db") : null; }catch(e){}
    if(user){
      try{
        var me = await user.me();
        viewerName = me.name || "";
        uidVal = me.id;
      }catch(e){}
    }
    if(db && uidVal){
      perfilRef = db.doc("data/users/" + uidVal + "/perfil");
      dbc = perfilRef.collection("contratos");
      mode = "ready";
      subscribe();
    } else {
      mode = "local";
      localLoad();
      render();

  function subscribe(){
    dbc.orderBy("dataVenda", "desc").limit(500).onSnapshot(function(snap){
      contratos = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){
      if(err.code === "revoked"){ mode = "revoked"; render(); }
    });
    perfilRef.onSnapshot(function(snap){
      perfil = Object.assign({ metaMensal: 6000 }, snap.data() || {});
      render();
    });
  }

  async function saveContrato(data, id){
    if(mode === "ready"){
      if(id){ await dbc.doc(id).update(data); }
      else{ await dbc.add(Object.assign({ criadoEm: new Date().toISOString(), repasses: [] }, data)); }
    } else {
      if(id){
        var idx = contratos.findIndex(function(c){ return c.id === id; });
        if(idx > -1) contratos[idx] = Object.assign({}, contratos[idx], data);
      } else {
        contratos.unshift(Object.assign({ id: genId(), criadoEm: new Date().toISOString(), repasses: [] }, data));
      }
      localSave(); render();
    }
  }
  async function removeContrato(id){
    if(mode === "ready"){ await dbc.doc(id).delete(); }
    else{ contratos = contratos.filter(function(c){ return c.id !== id; }); localSave(); render(); }
  }
  async function registrarRepasse(id, repasse){
    var c = contratos.find(function(x){ return x.id === id; });
    if(!c) return;
    var reps = (c.repasses || []).concat([repasse]);
    await saveContrato({ repasses: reps }, id);
  }
  async function loadSampleData(){
    if(loadingSample) return;
    loadingSample = true; render();
    var sample = sampleContratos();
    if(mode === "ready"){
      for(var i=0;i<sample.length;i++){
        var s = Object.assign({}, sample[i]); var sid = s.id; delete s.id;
        await dbc.doc(sid).set(Object.assign({ criadoEm: new Date().toISOString() }, s));
      }
    } else {
      contratos = contratos.concat(sample); localSave();
    }
    loadingSample = false; render();
  }
  async function clearAll(){
    if(mode === "ready"){
      for(var i=0;i<contratos.length;i++){ await dbc.doc(contratos[i].id).delete(); }
    } else {
      contratos = []; localSave(); render();

  async function saveMeta(v){
    perfil = Object.assign({}, perfil, { metaMensal: v });

    else{ localSave(); render(); }

  // ---------- derived data ----------
  function computeStats(){
    var curM = todayISO().slice(0,7);
    var prevD = new Date(); prevD.setMonth(prevD.getMonth()-1);
    var prevM = prevD.toISOString().slice(0,7);
    var recebidoMes = 0, recebidoPrevMes = 0, pendenteTotal = 0, recebidoTotal = 0;
    var cartasAtivas = 0, comissaoTotalSum = 0;
    var porSegmento = {}; SEGMENTOS.forEach(function(s){ porSegmento[s.id] = 0; });
    contratos.forEach(function(c){
      recebidoMes += sumRepasses(c, "recebido", curM);
      recebidoPrevMes += sumRepasses(c, "recebido", prevM);
      recebidoTotal += sumRepasses(c, "recebido", null);
      pendenteTotal += sumRepasses(c, "previsto", null);
      if(c.status === "ativo" || c.status === "contemplado") cartasAtivas++;
      comissaoTotalSum += Number(c.comissaoTotal)||0;
      if(porSegmento[c.segmento] !== undefined) porSegmento[c.segmento] += Number(c.comissaoTotal)||0;
    });
    var ticketMedio = contratos.length ? comissaoTotalSum / contratos.length : 0;
    var deltaMes = recebidoPrevMes > 0 ? ((recebidoMes - recebidoPrevMes) / recebidoPrevMes * 100) : (recebidoMes > 0 ? 100 : 0);
    return {
      recebidoMes: recebidoMes, recebidoPrevMes: recebidoPrevMes, deltaMes: deltaMes,
      pendenteTotal: pendenteTotal, recebidoTotal: recebidoTotal,
      cartasAtivas: cartasAtivas, ticketMedio: ticketMedio, porSegmento: porSegmento,
      comissaoTotalSum: comissaoTotalSum
    };
  }

  function computeAlerts(){
    var out = [];
    var today = todayISO();
    var in7 = new Date(); in7.setDate(in7.getDate()+7); var in7iso = in7.toISOString().slice(0,10);

  // ---------- flow chart (hand-rolled sankey, 3 columns) ----------
  function layoutColumn(items, totalH, y0, gap){
    var n = items.length;
    var totalVal = items.reduce(function(s,i){ return s + i.value; }, 0) || 1;
    var avail = Math.max(0, totalH - gap * Math.max(0, n-1));
    var y = y0;
    return items.map(function(it){
      var h = Math.max(3, avail * (it.value / totalVal));
      var seg = { key: it.key, value: it.value, y0: y, y1: y + h };
      y += h + gap;
      return seg;
    });
  }
  function ribbonPath(x1,y1a,y1b,x2,y2a,y2b){
    var mx = (x1+x2)/2;
    return "M"+x1+","+y1a+" C"+mx+","+y1a+" "+mx+","+y2a+" "+x2+","+y2a+
           " L"+x2+","+y2b+" C"+mx+","+y2b+" "+mx+","+y1b+" "+x1+","+y1b+" Z";
  }
  // pushes overlapping label centers apart (two-pass) so stacked text never collides, then clamps to bounds
  function declutter(centers, minGap, lo, hi){
    var c = centers.slice();
    for(var i=1;i<c.length;i++){ if(c[i]-c[i-1] < minGap) c[i] = c[i-1]+minGap; }
    for(var j=c.length-2;j>=0;j--){ if(c[j+1]-c[j] < minGap) c[j] = c[j+1]-minGap; }
    var overflow = c[c.length-1] - hi;
    if(overflow > 0) c = c.map(function(v){ return v - overflow; });
    var underflow = lo - c[0];
    if(underflow > 0) c = c.map(function(v){ return v + underflow; });
    return c;
  }
  function flowLegendItems(){
    return SEGMENTOS.map(function(s){ return { group: "l-"+s.id, label: s.label, color: "var("+s.cssvar+")" }; }).concat([
      { group: "r-recebido", label: "Recebido", color: "var(--good)" },
      { group: "r-pendente", label: "A receber", color: "var(--warn)" },
      { group: "r-semrepasse", label: "Sem repasse", color: "var(--ink-faint)" }
    ]);
  }
  function renderFlow(stats){
    var totalVal = SEGMENTOS.reduce(function(s,seg){ return s + Math.max(0, stats.porSegmento[seg.id]||0); }, 0);
    if(totalVal <= 0){
      return '<div class="flow-empty">Ainda não há valor de comissão lançado nos contratos.<br>Informe a comissão total de uma venda para ver o fluxo aqui.</div>';
    }

    var W = 900, H = 320, top = 34, gutter = 168;
    var colL = gutter, colLw = 10, colM = 440, colMw = 16, colR = W - gutter - 10, colRw = 10;
    var totalH = H - top*2;

    var leftItems = SEGMENTOS.map(function(s){ return { key: s.id, value: Math.max(0, stats.porSegmento[s.id]||0) }; }).filter(function(i){ return i.value > 0; });

    var sobra = Math.max(0, totalVal - stats.recebidoTotal - stats.pendenteTotal);
    var rightItems = [
      { key: "recebido", value: stats.recebidoTotal },
      { key: "pendente", value: stats.pendenteTotal },
      { key: "semrepasse", value: sobra }
    ].filter(function(i){ return i.value > 0.001; });
    if(!rightItems.length) rightItems = [{ key: "semrepasse", value: totalVal }];

    var left = layoutColumn(leftItems, totalH, top, 6);
    var midIn = layoutColumn(leftItems, totalH, top, 0);
    var midOut = layoutColumn(rightItems, totalH, top, 0);
    var right = layoutColumn(rightItems, totalH, top, 6);

    function dimCls(g){ return (flowSelected && flowSelected !== g) ? " flow-dim" : ""; }

    var svg = '<svg class="flow-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Fluxo de comissões">';

    // left -> mid ribbons
    left.forEach(function(seg, i){
      var mi = midIn[i];
      var g = "l-"+seg.key;
      var color = "var(" + (SEG_BY_ID[seg.key] ? SEG_BY_ID[seg.key].cssvar : "--ink-faint") + ")";
      svg += '<path class="flow-path'+dimCls(g)+'" data-group="'+esc(g)+'" d="'+ribbonPath(colL+colLw, seg.y0, seg.y1, colM, mi.y0, mi.y1)+'" fill="'+color+'" opacity="0.5"></path>';
    });
    // mid -> right ribbons
    right.forEach(function(seg, i){
      var mo = midOut[i];
      var g = "r-"+seg.key;
      var color = seg.key === "recebido" ? "var(--good)" : (seg.key === "pendente" ? "var(--warn)" : "var(--surface-3)");
      svg += '<path class="flow-path'+dimCls(g)+'" data-group="'+esc(g)+'" d="'+ribbonPath(colM+colMw, mo.y0, mo.y1, colR, seg.y0, seg.y1)+'" fill="'+color+'" opacity="'+(seg.key==="semrepasse"?0.28:0.5)+'"></path>';
    });
    // left nodes + labels (decluttered so thin slices never overlap their text)
    var leftTrue = left.map(function(seg){ return (seg.y0+seg.y1)/2; });
    var leftLab = declutter(leftTrue, 34, top+6, H-top-6);
    left.forEach(function(seg, i){
      var s = SEG_BY_ID[seg.key];
      var color = s ? "var("+s.cssvar+")" : "var(--ink-faint)";
      var pct = totalVal ? Math.round(seg.value/totalVal*100) : 0;
      var trueY = leftTrue[i], labY = leftLab[i];
      svg += '<rect class="flow-node'+dimCls("l-"+seg.key)+'" data-group="l-'+esc(seg.key)+'" x="'+colL+'" y="'+seg.y0+'" width="'+colLw+'" height="'+Math.max(1,seg.y1-seg.y0)+'" fill="'+color+'" rx="2"></rect>';
      if(Math.abs(labY-trueY) > 3){ svg += '<path d="M'+(colL-4)+','+trueY+' L'+(colL-10)+','+labY+'" stroke="var(--line-strong)" stroke-width="1" fill="none"></path>'; }
      svg += '<text class="flow-label-strong" x="'+(colL - 12)+'" y="'+(labY - 3)+'" text-anchor="end">'+esc(s?s.label:"—")+'</text>';
      svg += '<text class="flow-label" x="'+(colL - 12)+'" y="'+(labY + 12)+'" text-anchor="end">'+esc(fmtBRL(seg.value))+' · '+pct+'%</text>';
    });
    // mid node
    svg += '<rect x="'+colM+'" y="'+top+'" width="'+colMw+'" height="'+totalH+'" fill="var(--surface-3)" stroke="var(--line-strong)" rx="3"></rect>';
    svg += '<text class="flow-label-strong" x="'+(colM+colMw/2)+'" y="'+(top-16)+'" text-anchor="middle">Comissão bruta</text>';
    svg += '<text class="flow-label" x="'+(colM+colMw/2)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(fmtBRL(totalVal))+'</text>';
    // right nodes + labels (decluttered)
    var rightTrue = right.map(function(seg){ return (seg.y0+seg.y1)/2; });
    var rightLab = declutter(rightTrue, 34, top+6, H-top-6);
    right.forEach(function(seg, i){
      var color = seg.key === "recebido" ? "var(--good)" : (seg.key === "pendente" ? "var(--warn)" : "var(--ink-faint)");
      var label = seg.key === "recebido" ? "Recebido" : (seg.key === "pendente" ? "A receber" : "Sem repasse");
      var pct = totalVal ? Math.round(seg.value/totalVal*100) : 0;
      var trueY = rightTrue[i], labY = rightLab[i];
      svg += '<rect class="flow-node'+dimCls("r-"+seg.key)+'" data-group="r-'+esc(seg.key)+'" x="'+colR+'" y="'+seg.y0+'" width="'+colRw+'" height="'+Math.max(1,seg.y1-seg.y0)+'" fill="'+color+'" rx="2" opacity="'+(seg.key==="semrepasse"?0.55:1)+'"></rect>';
      if(Math.abs(labY-trueY) > 3){ svg += '<path d="M'+(colR+colRw+4)+','+trueY+' L'+(colR+colRw+10)+','+labY+'" stroke="var(--line-strong)" stroke-width="1" fill="none"></path>'; }
      svg += '<text class="flow-label-strong" x="'+(colR+colRw+12)+'" y="'+(labY - 3)+'">'+esc(label)+'</text>';
      svg += '<text class="flow-label" x="'+(colR+colRw+12)+'" y="'+(labY + 12)+'">'+esc(fmtBRL(seg.value))+' · '+pct+'%</text>';
    });
    svg += "</svg>";
    return svg;
  }

  // ---------- render ----------
  function statusBadge(status){
    var st = STATUS[status] || STATUS.ativo;
    return '<span class="badge '+st.tone+'">'+esc(st.label)+'</span>';
  }
  function segLabel(id){ var s = SEG_BY_ID[id]; return s ? s.label : "—"; }

  function proximoRepasse(c){
    return (c.repasses||[]).filter(function(r){ return r.status === "previsto"; })
      .sort(function(a,b){ return a.data < b.data ? -1 : 1; })[0] || null;
  }
  function filteredContratos(){
    var t = search.trim().toLowerCase();
    var today = todayISO();
    return contratos.filter(function(c){
      if(statusFilter !== "todos" && c.status !== statusFilter) return false;
      if(dataDe && (c.dataVenda||"") < dataDe) return false;
      if(dataAte && (c.dataVenda||"") > dataAte) return false;
      if(repasseFilter !== "todos"){
        var prox = proximoRepasse(c);
        if(repasseFilter === "previsto" && !prox) return false;
        if(repasseFilter === "atrasado" && !(prox && prox.data < today)) return false;
        if(repasseFilter === "sem" && prox) return false;
      }
      if(!t) return true;
      return (c.cliente||"").toLowerCase().indexOf(t) > -1 ||
             (c.numeroCarta||"").toLowerCase().indexOf(t) > -1 ||
             (c.grupo||"").toLowerCase().indexOf(t) > -1;
    });
  }
  function toCsv(rows){
    var headers = ["Cliente","Telefone","Nº Carta","Grupo","Cota","Segmento","Status","Valor do Crédito","Data da Venda","Comissão %","Comissão Total","Comissão Recebida","Comissão Pendente","Próximo Repasse (Data)","Próximo Repasse (Valor)","Parcelas Pagas","Parcelas Totais","Observações"];
    function cell(v){
      var s = String(v == null ? "" : v);
      if(/[;"\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
      return s;
    }
    var lines = [headers.map(cell).join(";")];
    rows.forEach(function(c){
      var recebido = sumRepasses(c, "recebido", null);
      var pendente = sumRepasses(c, "previsto", null);
      var prox = proximoRepasse(c);
      lines.push([
        c.cliente, c.telefone||"", c.numeroCarta||"", c.grupo||"", c.cota||"",
        segLabel(c.segmento), (STATUS[c.status]||{}).label || c.status || "",

  function icsEscape(s){
    return String(s == null ? "" : s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  }
  function toIcs(){
    var today = todayISO();
    var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Central de Comissoes//Ademicon//PT-BR","CALSCALE:GREGORIAN"];
    var stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
    var count = 0;
    contratos.forEach(function(c){
      (c.repasses||[]).forEach(function(r, idx){
        if(r.status !== "previsto" || !r.data) return;
        count++;
        var overdue = r.data < today;
        var summary = (overdue ? "Repasse atrasado: " : "Repasse previsto: ") + c.cliente;
        var desc = "Carta " + (c.numeroCarta||"—") + " · Grupo " + (c.grupo||"—") + "/" + (c.cota||"—") + ". Valor " + fmtBRL(r.valor) + ".";
        lines.push("BEGIN:VEVENT");
        lines.push("UID:" + c.id + "-" + r.data + "-" + idx + "@carteira-ademicon");
        lines.push("DTSTAMP:" + stamp);
        lines.push("DTSTART;VALUE=DATE:" + r.data.replace(/-/g,""));
        lines.push("SUMMARY:" + icsEscape(summary));
        lines.push("DESCRIPTION:" + icsEscape(desc));
        lines.push("END:VEVENT");
      });
    });
    lines.push("END:VCALENDAR");
    return { text: lines.join("\r\n"), count: count };
  }

  // ---------- calculadora de compra/venda de carta ----------
  function calcCompute(){
    var ci = calcInputs;
    var parcelasRestantes = Math.max(0, (Number(ci.parcelasTotal)||0) - (Number(ci.parcelasPagas)||0));
    var sugestaoPago = (Number(ci.parcelasPagas)||0) * (Number(ci.valorParcela)||0);
    var sugestaoSaldo = parcelasRestantes * (Number(ci.valorParcela)||0);
    var valorJaPago = Number(ci.valorJaPago)||0;
    var saldoDevedor = Number(ci.saldoDevedor)||0;
    var agio = Number(ci.agioPercent)||0;
    var taxa = Number(ci.taxaTransferencia)||0;
    var ajusteAgio = valorJaPago * (agio/100);
    var precoNegociado = valorJaPago + ajusteAgio;
    var vendedorRecebe = ci.taxaPagaPor === "vendedor" ? precoNegociado - taxa : precoNegociado;
    var compradorEntrada = ci.taxaPagaPor === "comprador" ? precoNegociado + taxa : precoNegociado;
    var compradorTotal = compradorEntrada + saldoDevedor;
    return {
      parcelasRestantes: parcelasRestantes, sugestaoPago: sugestaoPago, sugestaoSaldo: sugestaoSaldo,
      valorJaPago: valorJaPago, saldoDevedor: saldoDevedor, agio: agio, taxa: taxa,
      ajusteAgio: ajusteAgio, precoNegociado: precoNegociado,
      vendedorRecebe: vendedorRecebe, compradorEntrada: compradorEntrada, compradorTotal: compradorTotal
    };
  }

    html += '<div class="calc-note">Simulação com base nos valores informados acima — ajuste o ágio/deságio e as taxas conforme a negociação e as regras vigentes da Ademicon para essa carta específica antes de formalizar.</div>';
    html += '<div class="calc-copy-row"><button class="btn btn-primary" data-action="calc-copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:0.95rem;height:0.95rem;"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copiar resumo para o cliente</button><span class="calc-copy-msg" id="calc-copy-msg"></span></div>';
    html += '</div>'; // .calc-results

    html += '</div></div>'; // .calc-grid, .card

  }
  function calcResumoTexto(){
    var ci = calcInputs, r = calcCompute();
    var lines = [];
    lines.push("SIMULAÇÃO — COMPRA E VENDA DE CARTA DE CRÉDITO");
    if(ci.cliente) lines.push("Cliente: " + ci.cliente);
    lines.push("Segmento: " + segLabel(ci.segmento) + " · Situação: " + (ci.contemplada === "sim" ? "Contemplada" : "Não contemplada"));

    lines.push("Ágio/deságio (" + r.agio + "%): " + (r.ajusteAgio>=0?"+":"") + fmtBRL(r.ajusteAgio));
    if(ci.taxaPagaPor === "vendedor") lines.push("Taxa de transferência: -" + fmtBRL(r.taxa));
    lines.push("Valor líquido ao vendedor: " + fmtBRL(r.vendedorRecebe));

  // ---------- CSV parsing ----------
  function detectDelimiter(line){
    var candidates = [",",";","\t"], best = ",", bestCount = -1;
    candidates.forEach(function(c){ var n = line.split(c).length; if(n>bestCount){bestCount=n;best=c;} });
    return best;
  }
  function splitCsvLine(line, delim){
    var out = [], cur = "", inQ = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(inQ){
        if(ch === '"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; }
        else cur += ch;
      } else {
        if(ch === '"') inQ = true;
        else if(ch === delim){ out.push(cur); cur=""; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out.map(function(s){ return s.trim(); });
  }
  function parseCsv(text){
    var lines = text.replace(/\r\n/g,"\n").split("\n").filter(function(l){ return l.trim().length; });
    if(!lines.length) return null;
    var delim = detectDelimiter(lines[0]);
    var headers = splitCsvLine(lines[0], delim);
    var rows = lines.slice(1).map(function(l){ return splitCsvLine(l, delim); });
    return { headers: headers, rows: rows };
  }
  function guessSegmento(text){
    var t = (text||"").toLowerCase();
    if(t.indexOf("imov")>-1) return "imovel";
    if(t.indexOf("veic")>-1 || t.indexOf("auto")>-1) return "veiculo";
    if(t.indexOf("pesad")>-1 || t.indexOf("moto")>-1 || t.indexOf("caminh")>-1) return "pesados";
    return "servicos";
  }

  function wireEvents(){

        }
        else if(action === "submit-import"){
          var ci = document.getElementById("im-cliente").value, cc = document.getElementById("im-carta").value,
              cs = document.getElementById("im-segmento").value, cv = document.getElementById("im-valor").value,
              cco = document.getElementById("im-comissao").value, cd = document.getElementById("im-data").value;
          if(ci === ""){ document.getElementById("import-msg").innerHTML = '<div class="msg err">Selecione ao menos a coluna do cliente.</div>'; return; }
          var toAdd = importParsed.rows.map(function(r){
            return {
              cliente: r[Number(ci)]||"",
              numeroCarta: cc!==""?r[Number(cc)]:"",
              segmento: cs!==""?guessSegmento(r[Number(cs)]):"servicos",
              valorCredito: cv!==""?Number((r[Number(cv)]||"0").replace(/[^\d.,-]/g,"").replace(",",".")):0,
              comissaoTotal: cco!==""?Number((r[Number(cco)]||"0").replace(/[^\d.,-]/g,"").replace(",",".")):0,
              dataVenda: cd!==""?r[Number(cd)]:todayISO(),
              status: "ativo", grupo: "", cota: "", telefone: "", comissaoPercentual: 0,
              parcelasPagas: 0, parcelasTotal: 0, observacoes: "Importado via planilha."
            };
          }).filter(function(r){ return r.cliente; });
          (async function(){
            for(var i=0;i<toAdd.length;i++){ await saveContrato(toAdd[i]); }
            openDrawerName = null; importParsed = null; render();
          })();
        }
        else if(action === "toggle-flow-legend"){
          var lg = t.getAttribute("data-group");
          flowSelected = (flowSelected === lg) ? null : lg;
          render();
        }
      }
      if(svgGroup && !t){
        var group = svgGroup.getAttribute("data-group");
        flowSelected = (flowSelected === group) ? null : group;
        render();
      }
    });

    app.addEventListener("mouseover", function(e){
      if(flowSelected) return;
      var svgGroup = e.target.closest("[data-group]");
      if(svgGroup){
        var group = svgGroup.getAttribute("data-group");
        document.querySelectorAll("[data-group]").forEach(function(el){
          el.classList.toggle("flow-dim", el.getAttribute("data-group") !== group);
        });
      }
    });
    app.addEventListener("mouseout", function(e){
      if(flowSelected) return;
      if((e.target.closest(".flow-svg") || e.target.closest(".legend")) && !e.relatedTarget){
        document.querySelectorAll("[data-group]").forEach(function(el){ el.classList.remove("flow-dim"); });
      }
    });

    app.addEventListener("input", function(e){
      if(e.target.id === "search-input"){ search = e.target.value; renderTablePartial(); }
      else if(e.target.id && e.target.id.indexOf("calc-") === 0){
        calcInputs[e.target.id.slice(5)] = e.target.value;
        renderPreserveFocus();
      }
    });
    app.addEventListener("change", function(e){
      if(e.target.id === "status-filter"){ statusFilter = e.target.value; renderTablePartial(); }
      if(e.target.id === "repasse-filter"){ repasseFilter = e.target.value; renderTablePartial(); }
      if(e.target.id === "data-de"){ dataDe = e.target.value; renderTablePartial(); }
      if(e.target.id === "data-ate"){ dataAte = e.target.value; renderTablePartial(); }
      if(e.target.id && e.target.id.indexOf("calc-") === 0){ calcInputs[e.target.id.slice(5)] = e.target.value; render(); }
      if(e.target.id === "import-file"){
        var f = e.target.files[0]; if(!f) return;
        var reader = new FileReader();
        reader.onload = function(ev){ document.getElementById("import-text").value = ev.target.result; };
        reader.readAsText(f, "utf-8");
      }
      if(e.target.id === "anexo-file"){
        var af = e.target.files[0]; if(af) handleAnexoUpload(af);
      }
    });
  }

  function renderTablePartial(){
    render();
    var input = document.getElementById("search-input");
    if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }

  init();
})();
</script>
